[project]
name = "modulo-01-fundamentos-ia-llms"
version = "0.1.0"
description = "Módulo 01 (versão Python): rede neural em NumPy, visão com MediaPipe, prompt engineering e RAG com pgvector"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.5.4",
    "openai==3.33.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "httpx==0.28.1",
    "mediapipe==1.1.1",
    "opencv-contrib-python==5.0.0.93",
    "pytest==9.1.1",
]

# Projeto próprio do módulo (não é workspace da raiz): rodar tudo a partir desta pasta com `uv run`.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["exemplos", "exercicios"]
pythonpath = ["."]
addopts = "-q"
