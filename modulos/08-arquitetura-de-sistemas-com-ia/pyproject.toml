[project]
name = "modulo-08-arquitetura"
version = "1.0.0"
description = "Módulo 08 (versão Python): padrões de arquitetura de sistemas com IA medidos com LLM local"
requires-python = ">=3.14,<3.15"
dependencies = [
    "openai==3.34.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
    "pytest==9.1.1",
]

# Projeto próprio do módulo (não é workspace da raiz). É "pacote" só para instalar `comum_py`
# em modo editável: assim qualquer script em exemplos/*/python/ faz `from comum_py import ...`.
[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "comum_py"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["exemplos", "exercicios"]
addopts = "-q --import-mode=importlib"
