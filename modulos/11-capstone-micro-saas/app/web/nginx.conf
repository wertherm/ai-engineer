server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA: qualquer rota desconhecida cai no index.html
  location / { try_files $uri /index.html; }

  # API e MCP no mesmo host da UI. Timeout longo: o LLM em CPU pode levar minutos.
  location ~ ^/(v1|mcp|docs|openapi\.json) {
    proxy_pass http://api:31100;
    proxy_read_timeout 900s;
    proxy_buffering off;
  }
}
