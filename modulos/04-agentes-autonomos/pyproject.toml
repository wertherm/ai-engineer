[project]
name = "modulo-04-agentes-autonomos"
version = "1.0.0"
description = "Módulo 04 (versão Python): agentes autônomos com openai, LangChain/LangGraph, MCP e pgvector"
requires-python = ">=3.14,<3.15"
dependencies = [
    "openai==3.35.0",
    "mcp==2.3.0",
    "langchain==1.4.6",
    "langchain-openai==1.7.2",
    "langchain-core==1.6.12",
    "langgraph==1.2.16",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "numpy==2.5.4",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pytest==9.1.1",
]

# Projeto próprio do módulo (não é workspace da raiz). É "pacote" só para instalar `comum_py`
# em modo editável: qualquer script em exemplos/*/python/ faz `from comum_py import ...`.
[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "comum_py"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["exemplos", "exercicios"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
