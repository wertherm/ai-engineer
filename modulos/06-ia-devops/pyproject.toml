[project]
name = "modulo-06-ia-devops"
version = "0.1.0"
description = "Módulo 06 · Ferramentas de IA para DevOps (versão Python): IaC copilot, agentes no kind, AIOps, ChatOps, Trivy e RAG de runbooks"
requires-python = ">=3.14,<3.15"
dependencies = [
    # exemplo 04 · anomalias.py (já era Python)
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    # portes do JS (exemplos 01-06 e exercícios 01-02)
    "openai==3.35.1",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
]

# Projeto próprio do módulo (não é workspace da raiz): rodar tudo a partir desta pasta com `uv run`.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["exemplos", "exercicios"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
