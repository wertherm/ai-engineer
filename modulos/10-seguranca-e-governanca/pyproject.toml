[project]
name = "modulo-10-seguranca-e-governanca"
version = "0.1.0"
description = "Módulo 10 · Segurança e Governança em IA (versão Python): explicabilidade, vieses, model card, prompt injection, PII e custos"
requires-python = ">=3.14,<3.15"
dependencies = [
    # exemplos 01-02 e exercício 01 (já eram Python)
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    # portes do JS (exemplos 03-05 e exercício 02)
    "openai==3.34.0",
    "psycopg[binary]==3.3.6",
    "pytest==9.1.1",
]

# Projeto próprio do módulo (não é workspace da raiz): rodar tudo a partir desta pasta com `uv run`.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["exemplos", "exercicios"]
pythonpath = ["."]
addopts = "-q"
