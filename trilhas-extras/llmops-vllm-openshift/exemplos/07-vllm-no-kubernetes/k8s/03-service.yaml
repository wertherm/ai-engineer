apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: llmops
  labels: {app: vllm}
spec:
  selector: {app: vllm}          # manda o tráfego para os pods com esse label
  ports:
    - name: http                 # nome da porta: o ServiceMonitor do OpenShift referencia por ele
      port: 8000
      targetPort: http
