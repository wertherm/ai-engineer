# Ponto de partida do exercício: um nginx "clássico". Roda liso no Docker e no Kubernetes padrão,
# mas quebra no OpenShift (SCC restricted-v2: UID aleatório, sem root, sem capabilities).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
spec:
  replicas: 1
  selector:
    matchLabels: {app: site}
  template:
    metadata:
      labels: {app: site}
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.31.6-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: site
spec:
  selector: {app: site}
  ports:
    - {name: http, port: 80, targetPort: 80}
